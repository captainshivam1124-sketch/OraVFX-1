<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>OraVFX — Admin</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="shell">
      <section id="login" class="auth">
        <b>ORAVFX</b><small>PRIVATE ADMIN</small>
        <h1>Inquiry Dashboard</h1>
        <p>Sign in to view client inquiries.</p>
        <form id="loginForm">
          <div class="password-field">
            <input
              id="password"
              type="password"
              placeholder="Admin password"
              autocomplete="current-password"
              required
            />
            <label class="password-toggle">
              <input id="showPassword" type="checkbox" />
              <span>Show password</span>
            </label>
          </div>
          <button type="submit">Enter Dashboard</button>
          <div id="loginMsg"></div>
        </form>
      </section>
      <section id="dash" class="hidden">
        <header>
          <div>
            <small>ORAVFX</small>
            <h1>Inquiry Dashboard</h1>
          </div>
          <div>
            <button id="refresh">Refresh</button><button id="logout">Logout</button>
          </div>
        </header>
        <div class="stats">
          <article><span>Total</span><strong id="total">0</strong></article>
          <article><span>Today</span><strong id="today">0</strong></article>
          <article>
            <span>Services</span><strong id="services">0</strong>
          </article>
        </div>
        <div class="toolbar">
          <input
            id="search"
            placeholder="Search name, email, company, service..."
          /><select id="filter">
            <option value="">All services</option>
          </select>
        </div>

        <div class="admin-panels">
          <section class="panel">
            <div class="panel-head">
              <h2>Package catalog</h2>
            </div>
            <div id="packageList" class="mini-list"></div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Orders</h2>
            </div>
            <div id="orderList" class="mini-list"></div>
          </section>
        </div>

        <div id="list"></div>
        <p id="empty" class="hidden">No inquiries found.</p>
        <p id="msg"></p>
      </section>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
